{% extends "base.html" %}

{% block title %}Organization Profile{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Organization Profile</h2>

        <a href="{{ url_for('pages.organizer_dashboard') }}"
           class="btn btn-outline-dark">
            Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="POST">

                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Organization Name</label>

                    <input type="text"
                           name="organization_name"
                           class="form-control"
                           value="{{ profile.organization_name }}"
                           maxlength="160"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Phone</label>

                    <input type="tel"
                           name="phone"
                           class="form-control"
                           value="{{ profile.phone or '' }}"
                           maxlength="30">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea name="description"
                              class="form-control"
                              rows="5"
                              placeholder="Describe your organization...">{{ profile.description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Approval Status</label>

                    <input type="text"
                           class="form-control"
                           value="{{ profile.approval_status }}"
                           disabled>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
