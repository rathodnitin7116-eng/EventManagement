{% extends "base.html" %}
{% block title %}Register | EventSphere{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
<div class="card shadow-sm border-0"><div class="card-body p-4">
<h2 class="fw-bold mb-3">Create your account</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" maxlength="120" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" maxlength="255" required></div>
<div class="mb-3"><label class="form-label">Password (minimum 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<div class="mb-3"><label class="form-label">Account type</label>
<select class="form-select" name="role" id="role" onchange="document.getElementById('org-field').hidden=this.value!=='ORGANIZER'">
<option value="CUSTOMER">Customer</option><option value="ORGANIZER">Organizer</option>
</select></div>
<div class="mb-3" id="org-field" hidden><label class="form-label">Organization name</label><input class="form-control" name="organization_name"></div>
<button class="btn btn-dark w-100">Register</button>
</form>
<p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div></div></div></div>
{% endblock %}
